# Robots, newest first. One entry per competition robot.
# - photo: file in src/assets/robots/ (defaults to "<year>.jpg" if it exists)
# - specs: short bullet points shown on the card
# - binder: link to the technical binder (optional)
# - Awards are pulled automatically from src/data/seasons.yaml.

- id: "2026"
